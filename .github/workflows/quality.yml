name: Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.39
        env:
          MYSQL_DATABASE: yunchuan_zhihui
          MYSQL_USER: yunchuan
          MYSQL_PASSWORD: yunchuan_dev
          MYSQL_ROOT_PASSWORD: root_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql+pymysql://yunchuan:yunchuan_dev@127.0.0.1:3306/yunchuan_zhihui
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check app tests
      - run: python -m compileall app tests
      - run: alembic upgrade head
      - run: python -m app.scripts.schema_smoke
      - run: alembic check
      - run: python -m pytest
